zerops:
  - setup: gate
    build:
      base: nodejs@20
      buildCommands:
        - npm ci
        - npm run build -w @oncegate/gate
      deployFiles:
        - apps/gate/dist
        - apps/gate/migrations
        - apps/gate/package.json
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      initCommands:
        - node apps/gate/dist/scripts/migrate.js
      start: node apps/gate/dist/server.js
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
  - setup: checkout
    build:
      base: nodejs@20
      buildCommands:
        - npm ci
        - npm run build -w @oncegate/checkout
      deployFiles:
        - apps/checkout/dist
        - apps/checkout/package.json
        - node_modules
    run:
      base: nodejs@20
      ports:
        - port: 3100
          httpSupport: true
      start: node apps/checkout/dist/server.js
      healthCheck:
        httpGet:
          port: 3100
          path: /healthz
  - setup: console
    build:
      base: nodejs@20
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./dist/~
    run:
      base: static
      ports:
        - port: 80
          httpSupport: true
      routing:
        redirects:
          - from: /*
            to: /index.html

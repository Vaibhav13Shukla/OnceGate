#yamlPreprocessor=on
project:
  name: oncegate
  description: Durable Idempotency-Key gateway
  corePackage: LIGHT

services:
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 1

  - hostname: cache
    type: valkey@7.2
    mode: NON_HA
    priority: 1

  - hostname: checkout
    type: nodejs@20
    mode: NON_HA
    envSecrets:
      DATABASE_URL: ${db_connectionString}
    envVariables:
      PORT: '3100'

  - hostname: gate
    type: nodejs@20
    mode: NON_HA
    enableSubdomainAccess: true
    envSecrets:
      DATABASE_URL: ${db_connectionString}
      ADMIN_TOKEN: <@generateRandomString(<32>)>
    envVariables:
      UPSTREAM_BASE_URL: 'http://checkout:3100'
      CORS_ORIGIN: '*'
      PORT: '3000'

  - hostname: console
    type: static
    mode: NON_HA
    enableSubdomainAccess: true
